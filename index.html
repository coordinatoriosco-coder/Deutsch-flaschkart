<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فلش‌کارت آلمانی بهزاد — نسخه ۱۶</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box} body{margin:0;background:#f3f4f6;color:#151515}
button,input,select{font:inherit} button{border:0;cursor:pointer}
.screen{min-height:100vh;display:none;padding:20px}.screen.active{display:flex;align-items:center;justify-content:center}
.panel{width:min(860px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 45px rgba(0,0,0,.09)}
h1,h2{margin:0 0 10px} .muted{color:#666;line-height:1.65}.center{text-align:center}
.grid{display:grid;gap:12px}.lang-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:22px}
.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:62vh;overflow:auto;padding:3px}
.mode-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:22px}
.btn{padding:13px 16px;border-radius:13px;background:#e9ebef;color:#111;font-weight:700}
.btn.primary{background:#161616;color:#fff}.btn.warn{background:#fff0f1;color:#990018}.btn.big{padding:22px;font-size:1.08rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.badge{background:#f0f1f4;border-radius:999px;padding:7px 11px;font-size:.9rem}
.study-card{border:1px solid #eceef1;border-radius:20px;padding:24px;min-height:380px;display:flex;flex-direction:column;justify-content:center}
.meaning{font-size:2rem;font-weight:850;text-align:center;line-height:1.45;margin:16px 0 24px}
.german{direction:ltr;font-size:1.8rem;font-weight:900;text-align:center;line-height:1.5;overflow-wrap:anywhere}
.answer-wrap{text-align:center;margin-top:18px}.answer-label{font-size:.86rem;color:#777;margin-bottom:6px}
.synonym-note{font-size:.88rem;color:#666;margin-top:8px}.example{direction:ltr;text-align:left;background:#f7f7f9;border-radius:13px;padding:12px 14px;margin-top:16px}
.answer-input{width:100%;padding:14px 16px;border:1px solid #cfd3d8;border-radius:13px;direction:ltr;text-align:left;font-size:1.08rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1}
.feedback{min-height:27px;text-align:center;font-weight:800;margin-top:10px}.good{color:#08792c}.bad{color:#b00020}
.nav-row{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.nav-buttons{display:flex;gap:10px;justify-content:center}
.nav-buttons .btn{flex:1}
.jump-row{display:flex;gap:10px;align-items:center}
.jump-row input{flex:1;min-width:0;padding:12px 14px;border:1px solid #d2d5da;border-radius:12px;background:#fff;direction:ltr;text-align:center}
.example-actions{display:flex;justify-content:center;margin-top:10px}
.report-box{background:#f7f7f9;border-radius:16px;padding:18px;margin-top:18px;line-height:1.8}
.report-big{font-size:1.15rem;font-weight:850}
.test-review-note{margin-top:10px;text-align:center;color:#7a5200;font-weight:700}
.hidden{display:none!important}
.category-title{font-weight:850;margin-bottom:10px}.category-button{text-align:start;padding:14px;border-radius:14px;background:#f0f1f4}.category-button small{display:block;color:#666;margin-top:4px}
.auto-stage{text-align:center}.auto-german{margin-top:20px;min-height:90px}.pulse{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.55}to{opacity:1}}
@media(max-width:620px){
 .screen{padding:12px}.panel{padding:18px;border-radius:18px}.lang-grid,.category-grid,.mode-grid{grid-template-columns:1fr}
 .meaning{font-size:1.55rem}.german{font-size:1.5rem}.nav-buttons,.jump-row{flex-direction:row}
 .study-card{padding:18px;min-height:420px}
}

.report-panel{max-width:720px}
.report-hero{font-size:4rem;line-height:1;margin:6px 0 10px}
.report-title-large{font-size:clamp(2rem,6vw,3.2rem);font-weight:950;margin:8px 0 6px}
.report-sub{font-size:1.1rem;color:#666;margin-bottom:12px}
.report-box{background:linear-gradient(180deg,#fafafa,#f3f4f6);border:1px solid #e7e8eb;border-radius:22px;padding:24px;margin-top:18px;line-height:1.9}
.report-big{font-size:clamp(1.35rem,4vw,2rem);font-weight:900;line-height:1.7}
.report-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.report-actions .btn{min-width:180px}
.progress-box{margin-top:16px;padding:18px;border-radius:16px;background:#fff7df;border:1px solid #f0dc9d;font-weight:750;line-height:1.9}
.hidden-soft{display:none}
@media(max-width:620px){
  .report-actions{flex-direction:column}
  .report-actions .btn{width:100%}
}


.sense-examples{margin-top:16px;text-align:start}
.sense-title{font-weight:900;font-size:1.02rem;margin:0 0 10px;text-align:center}
.sense-card{background:#f7f7f9;border:1px solid #e5e6ea;border-radius:15px;padding:13px 14px;margin-top:10px}
.sense-number{font-weight:900;color:#555;font-size:.9rem;margin-bottom:5px}
.sense-sentence{direction:ltr;text-align:left;font-size:1.12rem;font-weight:750;line-height:1.55}
.sense-meaning{margin-top:7px;font-size:.96rem;line-height:1.55}
.sense-play{margin-top:9px;width:100%}


.search-panel{background:#f7f7f9;border:1px solid #e5e6ea;border-radius:18px;padding:15px;margin:14px 0 18px}
.search-title{font-weight:900;margin-bottom:9px}
.search-row{display:flex;gap:9px}
.search-row input{flex:1;min-width:0;padding:12px 14px;border:1px solid #cfd3d8;border-radius:12px;font-size:1rem}
.search-results{display:grid;gap:9px;margin-top:11px}
.search-result{background:#fff;border:1px solid #e4e5e8;border-radius:13px;padding:12px;text-align:start}
.search-result .sr-de{direction:ltr;text-align:left;font-size:1.06rem;font-weight:900}
.search-result .sr-meta{font-size:.88rem;color:#666;margin-top:5px}
.search-empty{padding:10px;text-align:center;font-weight:800}
.sentence-translation{margin-top:7px;font-size:.98rem;line-height:1.6;font-weight:650}
.variant-title{font-weight:900;font-size:1.02rem;margin:18px 0 7px;text-align:center}
.variant-form{direction:ltr;text-align:left;font-weight:900;margin-bottom:5px}


.code-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:86px;
  padding:10px 16px;
  border-radius:16px;
  background:#ffd400;
  color:#111;
  font-size:1.45rem;
  font-weight:950;
  letter-spacing:.5px;
  border:3px solid #111;
  box-shadow:0 4px 0 #111,0 8px 18px rgba(0,0,0,.16);
}
.search-code{
  display:inline-block;
  margin-top:8px;
  padding:7px 12px;
  border-radius:12px;
  background:#ffd400;
  color:#111;
  font-size:1.18rem;
  font-weight:950;
  border:2px solid #111;
}


html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
button, input, select{
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button{
  min-height:44px;
}
input, select{
  font-size:16px !important;
}
.ios-file-hint{
  display:none;
  max-width:760px;
  margin:12px auto;
  padding:12px 16px;
  border-radius:14px;
  background:#fff4ce;
  border:1px solid #efd171;
  color:#332600;
  line-height:1.7;
  font-weight:700;
}

</style>
</head>
<body>
<noscript>
  <div style="max-width:760px;margin:18px auto;padding:16px;border-radius:14px;background:#fff4ce;font-family:system-ui;line-height:1.7">
    این فلش‌کارت برای کارکرد به JavaScript نیاز دارد. در آیفون فایل را با Safari باز کنید؛ پیش‌نمایش برنامه Files ممکن است JavaScript را اجرا نکند.
  </div>
</noscript>
<div id="iosFileHint" class="ios-file-hint">
  برای کارکرد کامل در آیفون، این فایل را داخل Safari باز کنید. پیش‌نمایش برنامه Files/Quick Look ممکن است دکمه‌ها، ذخیره‌سازی و پخش صوتی را اجرا نکند.
</div>

<section id="languageScreen" class="screen active">
  <div class="panel center">
    <h1 id="languageTitle"></h1>
    <div class="muted" id="languageHint"></div>
    <div class="grid lang-grid" id="languageGrid"></div>
  </div>
</section>

<section id="categoryScreen" class="screen">
  <div class="panel">
    <div class="top">
      <h2 id="categoryTitle"></h2>
      <button class="btn" id="backLanguageBtn"></button>
    </div>
    <div class="badges">
      <span class="badge" id="globalMistakeBadge"></span>
    </div>
    <div class="search-panel">
      <div class="search-title" id="searchTitle"></div>
      <div class="search-row">
        <input id="searchInput" autocomplete="off">
        <button class="btn primary" id="searchBtn"></button>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>
    <div class="grid category-grid" id="categoryGrid"></div>
  </div>
</section>

<section id="modeScreen" class="screen">
  <div class="panel center">
    <div class="top">
      <h2 id="modeTitle"></h2>
      <button class="btn" id="modeBackMenuBtn"></button>
    </div>
    <div class="badges">
      <span class="badge" id="chosenCategoryBadge"></span>
      <span class="badge" id="modeMistakeBadge"></span>
    </div>
    <div class="grid mode-grid">
      <button class="btn primary big" id="startTestBtn"></button>
      <button class="btn big" id="startLearnBtn"></button>
      <button class="btn big" id="startAutoBtn"></button>
      <button class="btn warn big" id="startMistakesBtn"></button>
    </div>
  </div>
</section>

<section id="studyScreen" class="screen">
  <div class="panel">
    <div class="top">
      <div>
        <div style="font-weight:850" id="studyModeTitle"></div>
        <div class="muted" id="studyCategoryTitle"></div>
      </div>
      <button class="btn" id="studyBackMenuBtn"></button>
    </div>

    <div class="badges">
      <span class="badge" id="studyCount"></span>
      <span class="code-badge" id="studyCode"></span>
      <span class="badge" id="studyMistakes"></span>
    </div>

    <div class="study-card">
      <div class="meaning" id="meaning"></div>

      <div id="testControls">
        <input class="answer-input" id="guess" autocomplete="off" autocapitalize="none" spellcheck="false">
        <div class="row">
          <button class="btn primary" id="checkBtn"></button>
          <button class="btn" id="revealBtn"></button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div id="answerWrap" class="answer-wrap hidden">
        <div class="answer-label" id="answerLabel"></div>
        <div class="code-badge" id="answerCode" style="margin:10px auto 0"></div>
        <div class="german" id="german"></div>
        <div class="synonym-note" id="synonymNote"></div>
        <div id="examplesArea">
          <div id="singleExampleBlock">
            <div class="example" id="example"></div>
            <div class="sentence-translation" id="singleExampleTranslation"></div>
            <div class="example-actions" id="exampleActions">
              <button class="btn" id="speakExampleBtn"></button>
            </div>
          </div>
          <div id="senseExamples" class="sense-examples hidden"></div>
          <div id="variantExamples" class="sense-examples hidden"></div>
        </div>
      </div>

      <div id="autoControls" class="hidden auto-stage">
        <div class="muted pulse" id="autoHint"></div>
        <div class="auto-german">
          <div class="german hidden" id="autoGerman"></div>
        </div>
        <button class="btn" id="pauseAutoBtn"></button>
      </div>

      <div class="nav-row" id="navRow">
        <div class="nav-buttons">
          <button class="btn" id="prevBtn"></button>
          <button class="btn primary" id="nextBtn"></button>
        </div>
        <div class="muted" id="jumpLabel" style="text-align:center"></div>
        <div class="jump-row">
          <input id="cardNumber" type="number" min="1" inputmode="numeric" aria-label="card number">
          <button class="btn" id="goCardBtn"></button>
        </div>
      </div>
    </div>
  </div>
</section>



<section id="reportScreen" class="screen">
  <div class="panel center report-panel">
    <div class="report-hero">🏆</div>
    <h2 class="report-title-large" id="reportTitle"></h2>
    <div class="report-sub" id="reportHeroText"></div>
    <div class="report-box">
      <div class="report-big" id="reportSummary"></div>
      <div class="muted" id="reportDetail"></div>
    </div>
    <div class="report-actions">
      <button class="btn" id="reportBackBtn"></button>
      <button class="btn primary" id="repeatTestBtn"></button>
    </div>
  </div>
</section>

<section id="learningReportScreen" class="screen">
  <div class="panel center report-panel">
    <div class="report-hero">🎉</div>
    <h2 class="report-title-large" id="learningDoneTitle"></h2>
    <div class="report-sub" id="learningDoneSub"></div>
    <div class="report-box">
      <div class="report-big" id="learningSummary"></div>
      <div class="muted" id="learningDetail"></div>
      <div class="progress-box hidden-soft" id="learningProgressBox"></div>
    </div>
    <div class="report-actions">
      <button class="btn" id="learningBackBtn"></button>
      <button class="btn primary" id="repeatLearningBtn"></button>
    </div>
  </div>
</section>

const MEMORY_STORAGE = {};
const APP_STORAGE = (function(){
  try{
    const s = window["localStorage"];
    const testKey = "__behzad_storage_test__";
    s.setItem(testKey, "1");
    s.removeItem(testKey);
    return s;
  }catch(e){
    return {
      getItem:function(key){
        return Object.prototype.hasOwnProperty.call(MEMORY_STORAGE,key) ? MEMORY_STORAGE[key] : null;
      },
      setItem:function(key,value){
        MEMORY_STORAGE[key]=String(value);
      },
      removeItem:function(key){
        delete MEMORY_STORAGE[key];
      }
    };
  }
})();

function readJSON(key, fallback){
  try{ const v=APP_STORAGE.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}

function t(){ return Object.assign({}, UI[lang] || UI.fa, EXTRA_UI[lang] || EXTRA_UI.fa); }
function dirForLanguage(){ return RTL.has(lang) ? "rtl" : "ltr"; }
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function catLabel(cat){
  if(cat==="__all__") return t().allCategories;
  return (CATEGORY_LABELS[cat] && CATEGORY_LABELS[cat][lang]) || (CATEGORY_LABELS[cat] && CATEGORY_LABELS[cat].fa) || cat;
}
function meaningFor(card){
  return (card.meanings && card.meanings[lang]) || (card.meanings && card.meanings.fa) || card.fa;
}
function answersFor(card){ return [card.de, ...(card.alternatives || [])]; }
function norm(s){
  return String(s||"").trim().toLocaleLowerCase("de")
    .replace(/[.!?،؛,:;"'’`]/g,"")
    .replace(/\s+/g," ")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
}
function isCorrect(card, guess){ return answersFor(card).map(norm).includes(norm(guess)); }
function mistakeId(card){ return card.id; }


function germanSearchKey(s){
  return norm(s).replace(/^(der|die|das)\s+/,"").trim();
}
function nativeSearchKey(s){
  return String(s||"").trim().toLocaleLowerCase(lang).replace(/\s+/g," ");
}
function cardMatchesSearch(card,q){
  const nq=nativeSearchKey(q);
  const gq=germanSearchKey(q);
  const germanForms=answersFor(card);
  const germanHit=germanForms.some(form=>{
    const full=norm(form);
    const bare=germanSearchKey(form);
    return full.includes(norm(q)) || bare.includes(gq) || (gq && gq.includes(bare));
  });
  const nativeHit=nativeSearchKey(meaningFor(card)).includes(nq);
  return germanHit || nativeHit;
}
function runSearch(){
  const box=document.getElementById("searchResults");
  const q=document.getElementById("searchInput").value.trim();
  box.innerHTML="";
  if(!q) return;
  const found=CARDS.filter(card=>cardMatchesSearch(card,q));
  if(!found.length){
    const d=document.createElement("div");
    d.className="search-empty";
    d.textContent=t().notFound;
    box.appendChild(d);
    return;
  }
  found.forEach(card=>{
    const d=document.createElement("div");
    d.className="search-result";
    const de=document.createElement("div");
    de.className="sr-de";
    de.textContent=answersFor(card).join(" / ");
    const code=document.createElement("div");
    code.className="search-code";
    code.textContent=`${t().codeLabel}: ${card.code}`;

    const meta=document.createElement("div");
    meta.className="sr-meta";
    meta.textContent=`${t().searchCategory}: ${catLabel(card.category)}`;

    d.appendChild(de);
    d.appendChild(code);
    d.appendChild(meta);
    box.appendChild(d);
  });
}
function buildLanguagePage(){
  document.documentElement.lang = lang;
  document.documentElement.dir = dirForLanguage();
  document.getElementById("languageTitle").textContent = t().chooseLanguage;
  document.getElementById("languageHint").textContent = t().languageHint;
  const grid=document.getElementById("languageGrid");
  grid.innerHTML="";
  LANGS.forEach(code=>{
    const b=document.createElement("button");
    b.className="btn big"+(code===lang?" primary":"");
    b.textContent=LANG_NAMES[code];
    b.onclick=()=>selectLanguage(code);
    grid.appendChild(b);
  });
}
function selectLanguage(code){
  lang=code;
  APP_STORAGE.setItem(K.lang,lang);
  document.documentElement.lang=lang;
  document.documentElement.dir=dirForLanguage();
  applyText();
  buildCategoryPage();
  const sr=document.getElementById("searchResults"); if(sr) sr.innerHTML="";
  const si=document.getElementById("searchInput"); if(si) si.value="";
  showScreen("categoryScreen");
}

function applyText(){
  document.title=t().title;
  document.getElementById("categoryTitle").textContent=t().chooseCategory;

  grid.innerHTML="";

function updateModeMistakeBadge(){

function openStudy(which){
  stopAuto();
  mode=which;

  if(which==="mistakes"){
    studyCards=selectedCards.filter(c=>mistakes.has(mistakeId(c)));
    if(!studyCards.length){ alert(t().noMistakes); return; }
  }else{
    studyCards=[...selectedCards];
  }
  if(!studyCards.length) return;

  if(which==="test"){
    testSession={
      category:selectedCategory,
      total:studyCards.length,
      answered:[],
      mistakes:[],
      initialMistakeCount:0,
      remaining:[],
      phase:"test",
      startedAt:new Date().toISOString()
    };
    saveTestSession();
    index=0;
  }else if(which==="learn"){
    const savedId=progress[selectedCategory];
    const found=studyCards.findIndex(c=>c.id===savedId);
    index=found>=0 ? found : 0;
    learningSession={
      category:selectedCategory,
      total:studyCards.length,
      seen:[],
      answered:[],
      correct:[],
      wrong:[],
      revealed:[],
      startedAt:new Date().toISOString()
    };
    learningRepeatArmed=false;
  }else{
    const savedId=progress[selectedCategory];
    const found=studyCards.findIndex(c=>c.id===savedId);
    index=(found>=0 && which!=="mistakes") ? found : 0;
  }

  showScreen("studyScreen");
  renderStudy();

  if(which==="auto"){
    autoRunning=true;
    document.getElementById("pauseAutoBtn").textContent=t().stop;
    runAutoCard();
  }
}

function renderStudy(){
  const card=studyCards[index];
  if(!card) return;
  if(mode==="learn" && learningSession && !learningSession.seen.includes(card.id)){
    learningSession.seen.push(card.id);
  }
  resolved=false;
  reviewedByReveal=false;
  if(mode!=="mistakes" && mode!=="testReview") saveProgress();

  document.getElementById("meaning").textContent=meaningFor(card);
  document.getElementById("german").textContent=answersFor(card).join(" / ");
  document.getElementById("answerCode").textContent=`${t().codeLabel}: ${card.code}`;
  document.getElementById("autoGerman").textContent=answersFor(card).join(" / ");
  document.getElementById("synonymNote").textContent=answersFor(card).length>1?t().equiv:"";
  document.getElementById("example").textContent=card.example || "";
  document.getElementById("singleExampleTranslation").textContent=translateSingleExample(card);
  renderSenseExamples(card);
  renderVariantExamples(card);
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";
  document.getElementById("answerWrap").classList.add("hidden");
  document.getElementById("guess").value="";

  document.getElementById("studyCount").textContent=`${t().card} ${index+1} ${t().of} ${studyCards.length}`;
  document.getElementById("studyCode").textContent=`${t().codeLabel}: ${card.code}`;
  document.getElementById("studyMistakes").textContent=`${t().mistakeCount}: ${selectedCards.filter(c=>mistakes.has(mistakeId(c))).length}`;
  document.getElementById("studyCategoryTitle").textContent=t().category+": "+catLabel(selectedCategory);

  let title=t().modeTest;
  if(mode==="auto") title=t().modeAuto;
  else if(mode==="mistakes") title=t().modeMistakes;
  else if(mode==="learn") title=t().modeLearn;
  else if(mode==="testReview") title=t().testReviewTitle;
  document.getElementById("studyModeTitle").textContent=title;

  const auto=mode==="auto";
  const manualNav=(mode==="test" || mode==="learn");
  document.getElementById("testControls").classList.toggle("hidden",auto);
  document.getElementById("autoControls").classList.toggle("hidden",!auto);
  document.getElementById("navRow").classList.toggle("hidden",!manualNav);
  const showExamples=(mode==="learn" || mode==="mistakes");
  document.getElementById("examplesArea").classList.toggle("hidden",!showExamples);
  document.getElementById("exampleActions").classList.toggle("hidden",!showExamples);

  updateCardNumber();
  if(!auto) setTimeout(()=>document.getElementById("guess").focus(),40);
}
function updateCardNumber(){
  const field=document.getElementById("cardNumber");
  field.min="1";
  field.max=String(studyCards.length);
  field.value=String(index+1);
  field.title=t().jumpLabel;
}

function recordTestResult(card, correct){
  if(mode!=="test" || !testSession) return;
  if(!testSession.answered.includes(card.id)) testSession.answered.push(card.id);
  if(!correct && !testSession.mistakes.includes(card.id)) testSession.mistakes.push(card.id);
  saveTestSession();
}

function testIsComplete(){
  return mode==="test" && testSession && testSession.answered.length>=testSession.total;
}

function finishTestPhase(){
  if(!testSession || testSession.phase!=="test") return;
  testSession.initialMistakeCount=testSession.mistakes.length;
  testSession.remaining=[...testSession.mistakes];
  testSession.phase="review";
  saveTestSession();

  if(!testSession.remaining.length){
    showTestReport();
    return;
  }

  alert(t().testCompleteReview);
  mode="testReview";
  studyCards=selectedCards.filter(c=>testSession.remaining.includes(c.id));
  index=0;
  showScreen("studyScreen");
  renderStudy();
}

function showTestReport(){
  if(!testSession) return;
  const report={
    total:testSession.total,
    mistakes:testSession.initialMistakeCount || 0,
    category:selectedCategory,
    finishedAt:new Date().toISOString()
  };
  APP_STORAGE.setItem(K.lastReport, JSON.stringify(report));
  testSession.phase="done";
  saveTestSession();

  const template=report.mistakes===0?t().reportPerfectTemplate:t().reportTemplate;
  document.getElementById("reportTitle").textContent=t().reportTitle;
  document.getElementById("reportHeroText").textContent=t().reportHero;
  document.getElementById("reportSummary").textContent=template
    .replace("{total}", String(report.total))
    .replace("{mistakes}", String(report.mistakes));
  document.getElementById("reportDetail").textContent=report.mistakes===0 ? "" : t().reportFixed;
  document.getElementById("reportBackBtn").textContent="← "+t().back;
  document.getElementById("repeatTestBtn").textContent="↻ "+t().repeatTest;
  showScreen("reportScreen");
}


function recordLearningResult(card, correct, revealed=false){
  if(mode!=="learn" || !learningSession) return;
  if(!learningSession.answered.includes(card.id)) learningSession.answered.push(card.id);
  if(correct){
    if(!learningSession.correct.includes(card.id)) learningSession.correct.push(card.id);
  }else{
    if(!learningSession.wrong.includes(card.id)) learningSession.wrong.push(card.id);
  }
  if(revealed && !learningSession.revealed.includes(card.id)) learningSession.revealed.push(card.id);
}

function finishLearningSession(){
  if(!learningSession) return;

  const wrongSet=new Set(learningSession.wrong);
  const cleanCorrect=learningSession.correct.filter(id=>!wrongSet.has(id)).length;
  const answeredSet=new Set(learningSession.answered);
  const skipped=Math.max(0, learningSession.total-answeredSet.size);
  const accuracy=Math.round((cleanCorrect/Math.max(1,learningSession.total))*100);

  const record={
    category:selectedCategory,
    total:learningSession.total,
    correct:cleanCorrect,
    wrong:wrongSet.size,
    skipped,
    accuracy,
    finishedAt:new Date().toISOString()
  };
  learningHistory.push(record);
  saveLearningHistory();

  delete progress[selectedCategory];
  APP_STORAGE.setItem(K.progress, JSON.stringify(progress));

  const summary=t().learningSummary
    .replace("{total}",String(record.total))
    .replace("{correct}",String(record.correct))
    .replace("{wrong}",String(record.wrong))
    .replace("{skipped}",String(record.skipped))
    .replace("{accuracy}",String(record.accuracy));

  document.getElementById("learningDoneTitle").textContent=t().learningDone;
  document.getElementById("learningDoneSub").textContent=t().learningDoneSub;
  document.getElementById("learningSummary").textContent=summary;
  document.getElementById("learningDetail").textContent=`${t().completedCards}: ${learningSession.seen.length} / ${learningSession.total}`;
  document.getElementById("learningProgressBox").classList.add("hidden-soft");
  document.getElementById("learningProgressBox").textContent="";
  document.getElementById("repeatLearningBtn").textContent="↻ "+t().repeatLearning;
  learningRepeatArmed=false;
  showScreen("learningReportScreen");
}

function learningHistoryForCategory(){
  return learningHistory.filter(r=>r.category===selectedCategory);
}

function showLearningProgressThenRepeat(){
  const box=document.getElementById("learningProgressBox");
  const history=learningHistoryForCategory();
  if(!learningRepeatArmed){
    let msg="";
    if(history.length<=1){
      const last=history[history.length-1] || {accuracy:0};
      msg=t().learningProgressOne.replace("{accuracy}",String(last.accuracy));
    }else{
      const first=history[0], last=history[history.length-1];
      const change=last.accuracy-first.accuracy;
      const signed=(change>0?"+":"")+String(change);
      msg=t().learningProgressMany
        .replace("{first}",String(first.accuracy))
        .replace("{last}",String(last.accuracy))
        .replace("{change}",signed)
        .replace("{firstWrong}",String(first.wrong))
        .replace("{lastWrong}",String(last.wrong));
    }
    box.textContent=t().learningProgressTitle+" — "+msg;
    box.classList.remove("hidden-soft");
    document.getElementById("repeatLearningBtn").textContent="▶ "+t().startRepeatLearning;
    learningRepeatArmed=true;
    return;
  }

  delete progress[selectedCategory];
  APP_STORAGE.setItem(K.progress, JSON.stringify(progress));
  openStudy("learn");
}

function restartTest(){
  openStudy("test");
}

function markWrong(card){
  mistakes.add(mistakeId(card)); // Set means repeated wrong answers count only once.
  saveMistakes();
}
function clearMistake(card){
  mistakes.delete(mistakeId(card));
  saveMistakes();
}
function checkAnswer(){
  if(resolved) return;
  const card=studyCards[index];
  const guess=document.getElementById("guess").value.trim();
  if(!guess){
    document.getElementById("feedback").textContent=t().placeholder;
    document.getElementById("feedback").className="feedback bad";
    return;
  }

  const correct=isCorrect(card,guess);
  resolved=true;
  document.getElementById("answerWrap").classList.remove("hidden");

  if(correct){
    document.getElementById("feedback").textContent=t().correct;
    document.getElementById("feedback").className="feedback good";
    if(mode==="mistakes" || mode==="testReview") clearMistake(card);
  }else{
    markWrong(card);
    document.getElementById("feedback").textContent=t().wrong;
    document.getElementById("feedback").className="feedback bad";
  }

  if(mode==="test") recordTestResult(card, correct);
  if(mode==="learn") recordLearningResult(card, correct, false);

  updateStudyMistakes();

  const afterSpeech=()=>{
    if(mode==="test" && testIsComplete()){
      setTimeout(finishTestPhase,500);
    }else if(mode==="mistakes"){
      setTimeout(()=>advanceMistakeReview(correct),500);
    }else if(mode==="testReview"){
      setTimeout(()=>advanceTestReview(correct),500);
    }
  };
  speakAnswers(card,afterSpeech);
}
function revealAnswer(){
  const card=studyCards[index];
  const wasUnresolved=!resolved;
  if(wasUnresolved){
    resolved=true;
    reviewedByReveal=true;
    markWrong(card);
    if(mode==="test") recordTestResult(card,false);
    if(mode==="learn") recordLearningResult(card,false,true);
    document.getElementById("feedback").textContent=t().revealWrong;
    document.getElementById("feedback").className="feedback bad";
    updateStudyMistakes();
  }

  document.getElementById("answerWrap").classList.remove("hidden");

  const afterSpeech=()=>{
    if(wasUnresolved && mode==="test" && testIsComplete()){
      setTimeout(finishTestPhase,500);
    }else if(wasUnresolved && mode==="mistakes"){
      setTimeout(()=>advanceMistakeReview(false),500);
    }else if(wasUnresolved && mode==="testReview"){
      setTimeout(()=>advanceTestReview(false),500);
    }
  };
  speakAnswers(card,afterSpeech);
}
function updateStudyMistakes(){
  document.getElementById("studyMistakes").textContent=`${t().mistakeCount}: ${selectedCards.filter(c=>mistakes.has(mistakeId(c))).length}`;
  updateModeMistakeBadge();
}
function advanceMistakeReview(wasCorrect){
  if(mode!=="mistakes") return;
  if(wasCorrect){
    studyCards=studyCards.filter(c=>mistakes.has(mistakeId(c)));
    if(!studyCards.length){
      alert(t().reviewDone);
      showScreen("modeScreen");
      updateModeMistakeBadge();
      return;
    }
    if(index>=studyCards.length) index=0;
  }else{
    index=(index+1)%studyCards.length;
  }
  renderStudy();
}

function advanceTestReview(wasCorrect){
  if(mode!=="testReview" || !testSession) return;

  const current=studyCards[index];
  if(wasCorrect){
    testSession.remaining=testSession.remaining.filter(id=>id!==current.id);
    saveTestSession();
  }

  if(!testSession.remaining.length){
    showTestReport();
    return;
  }

  studyCards=selectedCards.filter(c=>testSession.remaining.includes(c.id));
  if(wasCorrect){
    if(index>=studyCards.length) index=0;
  }else{
    index=(index+1)%studyCards.length;
  }
  renderStudy();
}


function nextCard(){
  if(!(mode==="test" || mode==="learn")) return;

  if(mode==="learn" && index===studyCards.length-1 && learningSession &&
     learningSession.seen.length>=learningSession.total){
    finishLearningSession();
    return;
  }

  index=(index+1)%studyCards.length;
  renderStudy();
}
function prevCard(){
  if(!(mode==="test" || mode==="learn")) return;
  index=(index-1+studyCards.length)%studyCards.length;
  renderStudy();
}
function goPickedCard(){
  if(!(mode==="test" || mode==="learn")) return;
  const field=document.getElementById("cardNumber");
  const v=Number(field.value);
  if(Number.isInteger(v) && v>=1 && v<=studyCards.length){
    index=v-1;
    renderStudy();
  }else{
    field.setCustomValidity(t().invalidCard);
    field.reportValidity();
    field.setCustomValidity("");
  }
}

function getGermanVoice(){
  if(!("speechSynthesis" in window)) return null;
  try{
    const voices=window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
    return voices.find(function(v){ return /^de(-|_)/i.test(v.lang||""); }) ||
           voices.find(function(v){ return /^de/i.test(v.lang||""); }) || null;
  }catch(e){ return null; }
}

function primeSpeech(){
  if(!("speechSynthesis" in window)) return;
  try{
    const u=new SpeechSynthesisUtterance(" ");
    u.lang="de-DE";
    u.volume=0;
    window.speechSynthesis.speak(u);
    window.speechSynthesis.cancel();
  }catch(e){}
}

function speakAnswers(card, done){
  if(!("speechSynthesis" in window)){
    if(done) setTimeout(done,1100);
    return;
  }

  const text=answersFor(card).join(". ");
  let finished=false;
  let watchdog=null;

  const finish=function(){
    if(finished) return;
    finished=true;
    if(watchdog) clearTimeout(watchdog);
    if(done) done();
  };

  try{
    window.speechSynthesis.cancel();
    activeUtterance=new SpeechSynthesisUtterance(text);
    activeUtterance.lang="de-DE";
    activeUtterance.rate=.84;
    const voice=getGermanVoice();
    if(voice) activeUtterance.voice=voice;
    activeUtterance.onend=finish;
    activeUtterance.onerror=finish;

    // iOS Safari can occasionally fail to fire onend; watchdog prevents autoplay from getting stuck.
    watchdog=setTimeout(finish, Math.max(2200, Math.min(9000, text.length*115+1500)));

    const start=function(){
      try{ window.speechSynthesis.speak(activeUtterance); }
      catch(e){ finish(); }
    };

    if(IS_IOS) setTimeout(start,60);
    else start();
  }catch(e){
    finish();
  }
}

    "ist hier":{fa:"اینجاست.",ar:"هنا.",tr:"burada.",uk:"тут.",fr:"est ici.",so:"waa halkan.",en:"is here."},
    "ist dort":{fa:"آنجاست.",ar:"هناك.",tr:"orada.",uk:"там.",fr:"est là-bas.",so:"waa halkaas.",en:"is over there."},
    "ist nah":{fa:"نزدیک است.",ar:"قريب.",tr:"yakın.",uk:"близько.",fr:"est proche.",so:"waa dhow.",en:"is nearby."},
    "ist offen":{fa:"باز است.",ar:"مفتوح.",tr:"açık.",uk:"відкритий.",fr:"est ouvert.",so:"waa furan.",en:"is open."},
    "ist schön":{fa:"زیبا است.",ar:"جميل.",tr:"güzel.",uk:"гарний.",fr:"est beau.",so:"waa qurux badan.",en:"is beautiful."},
    "kommt":{fa:"می‌آید.",ar:"يأتي.",tr:"geliyor.",uk:"прибуває.",fr:"arrive.",so:"wuu imanayaa.",en:"is coming / arriving."},
    "fliegt":{fa:"پرواز می‌کند.",ar:"يطير.",tr:"uçuyor.",uk:"летить.",fr:"vole.",so:"wuu duulayaa.",en:"is flying."}
  };
  for(const [ending,map] of Object.entries(predicates)){
    if(clean.endsWith(ending+".")){
      const pred=map[lang] || "";
      if(lang==="fa") return `${m} ${pred}`;
      if(lang==="ar") return `${m} ${pred}`;
      if(lang==="tr") return `${m} ${pred}`;
      if(lang==="uk") return `${m} ${pred}`;
      if(lang==="fr") return `${m} ${pred}`;
      if(lang==="so") return `${m} ${pred}`;
    }
  }

  // Complete, explicit fallback instead of showing only an isolated word meaning.
  const fallback={
    fa:`معنی کامل این جمله در این فلش‌کارت: «${m}».`,
    ar:`المعنى الكامل لهذه الجملة في هذه البطاقة: «${m}».`,
    tr:`Bu cümlenin bu karttaki tam anlamı: «${m}».`,
    uk:`Повний зміст цього речення в цій картці: «${m}».`,
    fr:`Le sens complet de cette phrase dans cette carte est : «${m}».`,
    so:`Macnaha buuxa ee jumladdan kaarkan waa: «${m}».`,
    en:`The full meaning of this sentence in this flashcard is: «${m}».`
  };
  return fallback[lang] || m;
}

function translateSingleExample(card){
  const sentence=card.example || "";
  const exact=SINGLE_EXAMPLE_TRANSLATIONS[sentence];
  if(exact && exact[lang]) return `${t().sentenceMeaning}: ${exact[lang]}`;
  const translated=sentenceFromMeaningTemplate(card, sentence);
  return translated ? `${t().sentenceMeaning}: ${translated}` : "";
}

function fullSentenceTranslation(card, sentence, idx, fallbackMeaning){
  const byWord=POLY_TRANSLATIONS[card.de];
  if(byWord && byWord[lang] && byWord[lang][idx]) return byWord[lang][idx];
  return sentenceFromMeaningTemplate({...card, meanings:{...(card.meanings||{}), [lang]:fallbackMeaning}}, sentence);
}

function renderVariantExamples(card){
  const container=document.getElementById("variantExamples");
  const entries=ALT_EXAMPLES[card.de] || [];
  if(!entries.length || !(mode==="learn" || mode==="mistakes")){
    container.classList.add("hidden");
    container.innerHTML="";
    return;
  }
  container.classList.remove("hidden");
  container.innerHTML="";
  const title=document.createElement("div");
  title.className="variant-title";
  title.textContent=t().variantExamples;
  container.appendChild(title);

  entries.forEach(entry=>{
    const box=document.createElement("div");
    box.className="sense-card";

    const form=document.createElement("div");
    form.className="variant-form";
    form.textContent=entry.form;

    const sentence=document.createElement("div");
    sentence.className="sense-sentence";
    sentence.textContent=entry.sentence;

    const native=document.createElement("div");
    native.className="sentence-translation";
    native.textContent=`${t().sentenceMeaning}: ${(entry.translations && entry.translations[lang]) || (entry.translations && entry.translations.fa) || ""}`;

    const btn=document.createElement("button");
    btn.className="btn sense-play";
    btn.type="button";
    btn.textContent=t().playSense;
    btn.onclick=()=>speakGermanSentence(entry.sentence);

    box.appendChild(form);
    box.appendChild(sentence);
    box.appendChild(native);
    box.appendChild(btn);
    container.appendChild(box);
  });
}

function splitNativeMeanings(card){
  return String(meaningFor(card)||"").split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);
}

function speakGermanSentence(text){
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="de-DE";
    u.rate=.84;
    const voice=getGermanVoice();
    if(voice) u.voice=voice;

    // Keep a strong reference on iOS so the utterance is not garbage-collected mid-speech.
    activeUtterance=u;

    const start=function(){
      try{ window.speechSynthesis.speak(u); }catch(e){}
    };
    if(IS_IOS) setTimeout(start,60);
    else start();
  }catch(e){}
}

function renderSenseExamples(card){
  const container=document.getElementById("senseExamples");
  const single=document.getElementById("singleExampleBlock");
  const examples=POLY_EXAMPLES[card.de] || null;

  if(!examples || examples.length<2){
    container.classList.add("hidden");
    container.innerHTML="";
    single.classList.remove("hidden");
    return;
  }

  const nativeMeanings=splitNativeMeanings(card);
  single.classList.add("hidden");
  container.classList.remove("hidden");
  container.innerHTML="";

  const title=document.createElement("div");
  title.className="sense-title";
  title.textContent=t().senseExamples;
  container.appendChild(title);

  examples.forEach((sentence,idx)=>{
    const box=document.createElement("div");
    box.className="sense-card";

    const num=document.createElement("div");
    num.className="sense-number";
    num.textContent=`${idx+1}. ${t().senseLabel}`;

    const de=document.createElement("div");
    de.className="sense-sentence";
    de.textContent=sentence;

    const native=document.createElement("div");
    native.className="sense-meaning";
    native.textContent=`${t().sentenceMeaning}: ${fullSentenceTranslation(card, sentence, idx, nativeMeanings[idx] || meaningFor(card))}`;

    const btn=document.createElement("button");
    btn.className="btn sense-play";
    btn.type="button";
    btn.textContent=t().playSense;
    btn.onclick=()=>speakGermanSentence(sentence);

    box.appendChild(num);
    box.appendChild(de);
    box.appendChild(native);
    box.appendChild(btn);
    container.appendChild(box);
  });
}

function speakExample(){
  const card=studyCards[index];
  if(!card || !card.example) return;
  speakGermanSentence(card.example);
}

function runAutoCard(){
  if(!autoRunning || mode!=="auto") return;
  clearTimeout(autoTimer);
  const card=studyCards[index];
  document.getElementById("meaning").textContent=meaningFor(card);
  document.getElementById("autoGerman").textContent=answersFor(card).join(" / ");
  document.getElementById("autoGerman").classList.add("hidden");
  document.getElementById("answerWrap").classList.add("hidden");
  document.getElementById("autoHint").textContent=t().autoWait;
  document.getElementById("studyCount").textContent=`${t().card} ${index+1} ${t().of} ${studyCards.length}`;
  document.getElementById("studyCategoryTitle").textContent=t().category+": "+catLabel(selectedCategory);
  saveProgress();

  // Exactly as requested:
  // 1) show mother-language meaning for 3 seconds
  // 2) then reveal + pronounce all accepted German answers
  // 3) after pronunciation finishes, wait 1 second and go to next card
  autoTimer=setTimeout(()=>{
    if(!autoRunning) return;
    document.getElementById("autoGerman").classList.remove("hidden");
    speakAnswers(card,()=>{
      if(!autoRunning) return;
      autoTimer=setTimeout(()=>{
        if(!autoRunning) return;
        index=(index+1)%studyCards.length;
        runAutoCard();
      },1000);
    });
  },3000);
}
function toggleAutoPause(){
  if(mode!=="auto") return;
  if(autoRunning){
    autoRunning=false;
    clearTimeout(autoTimer);
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    document.getElementById("pauseAutoBtn").textContent=t().resume;
  }else{
    autoRunning=true;
    document.getElementById("pauseAutoBtn").textContent=t().stop;
    runAutoCard();
  }
}
function stopAuto(){
  autoRunning=false;
  clearTimeout(autoTimer);
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
}
function backToMenu(){
  stopAuto();
  buildCategoryPage();
  updateModeMistakeBadge();
  showScreen("categoryScreen");
}
function backToMode(){
  stopAuto();
  updateModeMistakeBadge();
  showScreen("modeScreen");
}
function backToLanguage(){
  stopAuto();
  buildLanguagePage();
  showScreen("languageScreen");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
}

// iOS requires audio/speech to be unlocked from a real user gesture.
document.addEventListener("touchstart", primeSpeech, {once:true, passive:true});
document.addEventListener("click", primeSpeech, {once:true});

// Wiring
document.getElementById("backLanguageBtn").onclick=backToLanguage;
document.getElementById("modeBackMenuBtn").onclick=backToMenu;
document.getElementById("studyBackMenuBtn").onclick=backToMode;
document.getElementById("searchBtn").onclick=runSearch;
document.getElementById("searchInput").addEventListener("keydown",e=>{ if(e.key==="Enter") runSearch(); });
document.getElementById("startTestBtn").onclick=()=>openStudy("test");
document.getElementById("startLearnBtn").onclick=()=>openStudy("learn");
document.getElementById("startAutoBtn").onclick=function(){ primeSpeech(); openStudy("auto"); };
document.getElementById("startMistakesBtn").onclick=()=>openStudy("mistakes");
document.getElementById("checkBtn").onclick=checkAnswer;
document.getElementById("revealBtn").onclick=revealAnswer;
document.getElementById("prevBtn").onclick=prevCard;
document.getElementById("nextBtn").onclick=nextCard;
document.getElementById("goCardBtn").onclick=goPickedCard;
document.getElementById("cardNumber").addEventListener("keydown",e=>{ if(e.key==="Enter") goPickedCard(); });
document.getElementById("speakExampleBtn").onclick=speakExample;
document.getElementById("reportBackBtn").onclick=backToMode;
document.getElementById("repeatTestBtn").onclick=restartTest;
document.getElementById("learningBackBtn").onclick=backToMode;
document.getElementById("repeatLearningBtn").onclick=showLearningProgressThenRepeat;
document.getElementById("pauseAutoBtn").onclick=toggleAutoPause;
document.getElementById("guess").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(!resolved) checkAnswer();
    else if(mode==="test" || mode==="learn") nextCard();
  }
});

buildLanguagePage();
applyText();
showIOSFileHintIfNeeded();
</script>
